[project]
name = "gauntlet-sandbox"
version = "0.1.0"
description = "Run commands in an isolated Workshop or Docker sandbox"
authors = [
    { name = "Gajesh Bhat", email = "gajeshbht@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.21,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gauntlet_sandbox"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
