# ~/.config/gauntlet/policy.toml: YOUR rules. A repository's gauntlet.toml can tighten these, never weaken them.
# Keep this file out of any repository an agent can edit. Every value shown is the default.
crap_ceiling = 8            # a function's CRAP score (complexity^2 x (1-coverage)^3 + complexity) may not exceed this
mutation_floor = 90         # minimum mutation score, percent
max_exclusions = 10         # budget of `pragma: no cover|no mutate`, `nolint`, `nosec` comments
allow_config_excludes = false  # coverage omit/include/exclude_*, mutmut do_not_mutate in the repo config
allow_unstamped = false     # accept artifacts that were not produced from the current source
require_pin = false         # refuse a gauntlet.toml you have not pinned with `gauntlet pin`

# Only for `gauntlet loop`: the coding agent that runs inside the sandbox. The prompt is appended as the last argument.
# The token is passed by NAME; set it in the environment of the command, never here.
# agent_command = ["claude", "-p", "--dangerously-skip-permissions"]
# agent_env = ["CLAUDE_CODE_OAUTH_TOKEN"]
# agent_timeout = 1800      # seconds per agent run
# max_rounds = 3            # Fixer rounds before the loop gives up

[pins]
