language = "python"
src = "packages/gauntlet-core/src"

# Outermost first; imports may only point down this list.
[layers]
order = [
  "gauntlet_python",  # a plugin: core never imports it (it is found through the entry-point registry)
  "gauntlet.cli",
  "gauntlet.runner",
  "gauntlet.backends",
  "gauntlet.openshell",
  "gauntlet.sandbox",
  "gauntlet.spec",
  "gauntlet.diagram",
  "gauntlet.scaffold",
  "gauntlet.report",
  "gauntlet.clean",
  "gauntlet.harden",
  "gauntlet.changed",
  "gauntlet.linecov",
  "gauntlet.arch",
  "gauntlet.exclusions",
  "gauntlet.snapshot",
  "gauntlet.policy",
  "gauntlet.provenance",
  "gauntlet.config",
  "gauntlet.scope",
  "gauntlet.languages",
  "gauntlet.plugin",
  "gauntlet.results",
  "gauntlet.safefs",
  "gauntlet.errors",
]
roots = ["packages/gauntlet-core/src", "packages/gauntlet-python/src"]

# Core never imports the plugin (it is found through the entry-point registry).
forbid = [
  "gauntlet -> gauntlet_python",
]
