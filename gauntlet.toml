language = "python"
src = "src"

# Outermost first; imports may only point down this list.
[layers]
order = [
  "gauntlet.pylang",  # a plugin: nothing in core imports it (it is found through the entry-point registry)
  "gauntlet.cli",
  "gauntlet.loop",
  "gauntlet.runner",
  "gauntlet.backends",
  "gauntlet.spec",
  "gauntlet.diagram",
  "gauntlet.scaffold",
  "gauntlet.report",
  "gauntlet.clean",
  "gauntlet.linecov",
  "gauntlet.arch",
  "gauntlet.exclusions",
  "gauntlet.sandbox",
  "gauntlet.snapshot",
  "gauntlet.policy",
  "gauntlet.provenance",
  "gauntlet.config",
  "gauntlet.scope",
  "gauntlet.languages",
  "gauntlet.plugin",
  "gauntlet.results",
  "gauntlet.safefs",
  "gauntlet.sandbox.select",
  "gauntlet.sandbox.docker",
  "gauntlet.sandbox.workshop",
  "gauntlet.sandbox.api",
  "gauntlet.sandbox.names",
  "gauntlet.sandbox.errors",
  "gauntlet.errors",
]

# The sandbox package imports nothing from the rest of gauntlet, so it can move out into its own package.
forbid = ["gauntlet.sandbox -> gauntlet except gauntlet.sandbox"]
