[project]
name = "task"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.mutmut]
source_paths = ["src/task/"]
do_not_mutate = ["src/task/__init__.py"]
