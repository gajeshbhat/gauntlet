[project]
name = "gauntlet-workspace"
version = "0.2.0"
description = "Dev workspace for gauntlet (not published)"
requires-python = ">=3.12"
dependencies = ["gauntlet-core[openshell]", "gauntlet-python"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gauntlet-core = { workspace = true }
gauntlet-python = { workspace = true }

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/gauntlet-core/src", "packages/gauntlet-python/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]  # test data tables read better on one line

[tool.ruff.lint.mccabe]
max-complexity = 8  # same ceiling the clean gate enforces on target repos

[tool.pyright]
include = ["packages"]
extraPaths = ["packages/gauntlet-core/src", "packages/gauntlet-python/src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov=gauntlet --cov=gauntlet_python --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json"
testpaths = ["packages/*/tests"]

[tool.mutmut]
source_paths = ["packages/gauntlet-core/src/gauntlet/", "packages/gauntlet-python/src/gauntlet_python/"]
pytest_add_cli_args = ["--no-cov"]
